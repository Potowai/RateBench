name: PWA — typecheck & build

on:
  push:
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck & build
        run: npm run build

      - name: Upload built PWA
        uses: actions/upload-artifact@v4
        with:
          name: ratebench-pwa
          path: pwa/dist
          if-no-files-found: error
